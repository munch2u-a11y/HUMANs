name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python scripts/check_portability.py
      - run: python scripts/check_docs.py
      - run: python -m pip install -e '.[test,cortex]'
      - run: python examples/api_playground.py
      - run: python -m pytest -ra
      - run: python -m habitus_ai.demo
