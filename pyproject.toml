[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitus-mind"
version = "0.1.0"
description = "A persistent local agent with a born-in cortex, evolving drives, explicit recall, and receipt-backed abilities"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "HUMAN Project"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
vector-stores = ["chromadb", "pinecone-client", "psycopg[binary]", "pgvector"]
cortex = ["torch>=2.10"]

[project.scripts]
habitus-mind = "habitus_ai.integrated_agent:main"
habitus-doctor = "habitus_ai.doctor:main"
habitus-rag = "habitus_ai.functional_agent:main"
habitus-demo = "habitus_ai.demo:main"
habitus-gestate = "habitus_ai.cli:gestate_main"
habitus-hatch = "habitus_ai.cli:hatch_main"
habitus-launch = "habitus_ai.app:main"

[project.urls]
Homepage = "https://github.com/munch2u-a11y/HUMANs"
Repository = "https://github.com/munch2u-a11y/HUMANs.git"
Issues = "https://github.com/munch2u-a11y/HUMANs/issues"
Documentation = "https://github.com/munch2u-a11y/HUMANs#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
